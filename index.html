    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #666;
      --accent: #0b5cad;
      --bg: #faf9f7;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #d8d6d1;
        --muted: #999;
        --accent: #6db3f2;
        --bg: #16181c;

    body {

      max-width: 42rem;
      margin: 0 auto;
      padding: 3rem 1.25rem;

      font-size: 1.5rem;
      text-align: left;

    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      margin: 0 0 0.5rem;
      display: flex;
      align-items: baseline;
      gap: 1rem;
    }
    li a {
      flex: 1;
    }
    .date {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
    }
    a {
      color: var(--accent);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
